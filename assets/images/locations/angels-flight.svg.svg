<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#e6dcc8"/>
  <rect x="280" y="100" width="240" height="400" fill="#8c7a6b" rx="20"/>
  <rect x="300" y="120" width="200" height="360" fill="#b8a99a" rx="10"/>
  <!-- funicular tracks -->
  <line x1="300" y1="480" x2="500" y2="120" stroke="#333" stroke-width="6"/>
  <line x1="320" y1="480" x2="520" y2="120" stroke="#333" stroke-width="6"/>
  <!-- two funicular cars -->
  <rect x="370" y="300" width="60" height="30" fill="#c0392b" rx="4"/>
  <rect x="430" y="250" width="60" height="30" fill="#2980b9" rx="4"/>
  <!-- label -->
  <text x="400" y="550" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#333" font-weight="bold">ANGELS FLIGHT</text>
  <text x="400" y="580" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">LA LA LAND – City of Stars</text>
</svg>