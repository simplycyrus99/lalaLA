<!doctype html>
<html lang="en">

<head>
    <title>Itineraries · La La L.A.</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="La La L.A. — a location tour of Damien Chazelle's La La Land (2016), built as a Live Museum of Movie Locations.">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/themes/noir.css">
    <link rel="stylesheet" href="assets/css/themes/technicolor.css">
    <script>document.documentElement.classList.add('js'); document.documentElement.dataset.theme = localStorage.getItem('lmml-theme') || 'noir';</script>
</head>

<body><a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">LA<br>LLL</span><span>LA LA L.A.</span></a>
        <nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="map.html">Map</a><a
                href="itinerary.html" aria-current="page">Itineraries</a><a href="about.html">About</a><a
                href="documentation.html">Documentation</a><a href="disclaimer.html">Disclaimer</a></nav>
        <div class="header-tools"><button class="tool-button" data-theme-toggle aria-expanded="false">Change
                theme</button></div>
    </header>
    <aside class="theme-drawer" aria-label="Theme selector">
    <p class="eyebrow">Two deliberate visual systems</p>
    <div class="theme-grid">
      <button class="theme-choice" data-set-theme="noir"><strong>Noir Case File</strong><span>1940s police dossier</span></button>
      <button class="theme-choice" data-set-theme="technicolor"><strong>Technicolor Musical</strong><span>La La Land sunset palette</span></button>
    </div>
    <p class="small">The selected theme is saved across pages.</p>
  </aside>
    <main id="main">
        <div class="page">
            <p class="eyebrow">Narrative planning</p>
            <h1 class="page-title">Walk through one film, three ways.</h1>
            <p class="lede" id="narrativeDescription"></p>
            <div class="route-controls" id="narrativeControls"></div>
            <div class="notice" id="routeNotice"></div>
            <section class="section">
                <div id="itineraryList" class="itinerary-list"></div>
            </section>
        </div>
    </main>
    <footer class="site-footer"><span>2026 © La La L.A. · University course prototype</span>
        <div class="page-step"><a class="button" href="map.html">← Map</a><a class="button" href="about.html">About
                →</a></div>
    </footer>
    <script src="assets/js/app.js"></script>
    <script src="data/locations.js"></script>
    <script>
        (function () {
            const D = window.LMML_DATA, L = D.locations;
            let key = new URLSearchParams(location.search).get('narrative') || 'route';
            const controls = document.getElementById('narrativeControls'),
                  list = document.getElementById('itineraryList'),
                  desc = document.getElementById('narrativeDescription'),
                  notice = document.getElementById('routeNotice');

            function chapter(l, k) {
                if (k === 'route') return l.routeChapter;
                if (k === 'songs') return l.song;
                return null;
            }

            function render() {
                controls.innerHTML = '';
                Object.entries(D.narratives).forEach(([k, n]) => {
                    const b = document.createElement('button');
                    b.className = 'button route-button' + (k === key ? ' active' : '');
                    b.textContent = n.title;
                    b.onclick = () => { key = k; history.replaceState(null, '', `?narrative=${k}`); render(); };
                    controls.appendChild(b);
                });
                const n = D.narratives[key];
                desc.textContent = n.description;
                notice.innerHTML = key === 'route'
                    ? `<strong>Fast-route estimate:</strong> ${D.project.routeDistanceKm} · ${D.project.routeDuration}. Treat each neighbourhood chapter as an independent half-day module when you want a shorter visit.`
                    : `<strong>Navigation note:</strong> this narrative is curatorial rather than geographically optimised. The location viewer still provides exact coordinates and map links.`;
                list.innerHTML = '';
                let last = '';
                n.order.forEach((id, i) => {
                    const l = L.find(x => x.id === id), ch = chapter(l, key);
                    if (ch && ch !== last) {
                        const h = document.createElement('h2');
                        h.className = 'chapter-label';
                        h.textContent = ch;
                        list.appendChild(h);
                        last = ch;
                    }
                    const a = document.createElement('article');
                    a.className = 'itinerary-stop';
                    a.innerHTML = `<img src="${l.image}" alt=""><div><span class="stop-time">${key === 'route' ? l.bestTime : `Stop ${i + 1}`}</span><h3>${l.title}</h3><p>${l.anchorWork} (${l.year}) · ${l.short}</p><small>${l.address}</small></div><a class="button" href="location.html?id=${l.id}&narrative=${key}">Open stop</a>`;
                    list.appendChild(a);
                });
                if (window.LMML) window.LMML.reveal(document);
            }
            render();
        })();
    </script>
</body>

</html>
